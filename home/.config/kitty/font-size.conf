# Terminal font size, kept out of kitty.conf on purpose.
#
# `omarchy display text size` drives the shell bar, GTK apps and the terminal
# together from one px value (terminal_pt = px * 9/12). The desktop wants 12px,
# but that maps to a 9pt terminal, which is too small to read here.
#
# That command rewrites kitty.conf with
#     sed -i -E "s/^font_size[[:space:]]+.*/font_size <pt>.0/"
# so it only touches a font_size line in kitty.conf itself. Kitty is last-wins,
# so setting it in an included file overrides whatever the slider wrote and
# survives future slider changes.
#
# To hand terminal size back to the slider, drop the `include` from kitty.conf.
font_size 12.0
