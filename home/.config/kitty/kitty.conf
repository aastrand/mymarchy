include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 9.0

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Translucent background. Only the background fades — glyphs stay fully
# opaque — so this can go much further than Hyprland's window opacity,
# which would fade the text too. Paired with blur in hypr/looknfeel.lua.
background_opacity 0.85
# Allow opacity to change in a running window, so it can be tuned live with
# the bindings below instead of restarting kitty for every experiment.
dynamic_background_opacity yes
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>d set_background_opacity default

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow remote access
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Scrollback (kitty defaults to 2000 lines)
scrollback_lines            5000
wheel_scroll_multiplier     3.0

# Hide the pointer as soon as typing starts
mouse_hide_wait             -1

# Fuzzy-search the scrollback buffer in an overlay
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i

# Jump straight to a tab (kitty has no default for these)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
include font-size.conf

# Do not block on the monitor's vblank.
#
# kitty froze for ~5s after every resume while XWayland apps (Firefox, Spotify)
# came back instantly. kitty is a native Wayland client that vsyncs via frame
# callbacks, which is the path that breaks: nvidia-utils disables user-session
# freezing during suspend, so Wayland clients keep issuing GPU work while the
# driver is going down. The kernel logs it every resume as
#   [drm:__nv_drm_semsurf_wait_fence_work_cb [nvidia_drm]] *ERROR*
#   Failed to register auto-value-update on pre-wait value for sync FD semaphore
#
# See https://github.com/hyprwm/Hyprland/issues/7230 and
#     https://github.com/basecamp/omarchy/issues/4891
#
# Costs vsync in the terminal (possible tearing while scrolling fast), which is
# a cheap trade for a terminal. If this is not enough, the heavier lever is
# Hyprland's render:explicit_sync = 0, which affects every window.
sync_to_monitor no
