#################################################
# rsnapshot.conf -- glasspane -> blackbox (SMB)  #
#################################################
#
# Rolling hardlinked snapshots. Every snapshot is a complete, browsable
# directory tree; unchanged files are hardlinks to the previous one, so ten
# snapshots of a 500MB set cost little more than 500MB.
#
# Destination is the NAS over SMB. That mount is nounix/forceuid, so POSIX
# permissions and ownership are NOT preserved -- hence -rt below rather than
# -a. Hardlinks do work over it, which is the part that matters.
#
# WARNING: this file is TAB-separated. Spaces will not work.

config_version	1.2

snapshot_root	/mnt/blackbox/Backups/glasspane/

# Refuse to run if the NAS is not mounted, rather than silently filling the
# local disk with a backup nobody would notice was local.
no_create_root	1

cmd_cp		/usr/bin/cp
cmd_rm		/usr/bin/rm
cmd_rsync	/usr/bin/rsync
cmd_logger	/usr/bin/logger
cmd_du		/usr/bin/du

#### retention -- mirrors the Back In Time policy from Ubuntu ####
# all snapshots for ~2 days (4/day), then daily, weekly, monthly
retain	alpha	8
retain	beta	7
retain	gamma	4
retain	delta	24

verbose		2
loglevel	3
logfile		/home/anders/.local/state/rsnapshot/rsnapshot.log
lockfile	/home/anders/.local/state/rsnapshot/rsnapshot.pid

# -rt not -a: no perms/owner/group, because SMB cannot represent them and
# every run would otherwise churn and log errors.
rsync_short_args	-rt
rsync_long_args	--delete --numeric-ids --delete-excluded --exclude-from=/home/anders/.config/rsnapshot/excludes

#### what to back up ####
backup	/home/anders/Documents/	glasspane/Documents/
backup	/home/anders/Pictures/	glasspane/Pictures/
backup	/home/anders/Videos/	glasspane/Videos/
backup	/home/anders/Downloads/	glasspane/Downloads/
