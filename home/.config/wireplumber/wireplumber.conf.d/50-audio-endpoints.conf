## Tidy up the audio menu.
##
## Two problems this solves:
##
## 1. The Scarlett Solo exposes two physical inputs -- XLR mic (Mic1) and
##    instrument/line (Mic2) -- but both carry node.nick "Scarlett Solo USB".
##    The bar shows the nick, so the menu listed the same name twice with no way
##    to tell which jack was which. Renaming the nicks makes them distinguishable.
##
## 2. The NVIDIA HDMI output is never used -- audio goes to the KEF over USB --
##    but it sat in the output list permanently. Disabling the node removes it.
##
## The Scarlett *playback* device is deliberately left alone: that is the
## headphone out, and it is used.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*Focusrite.*HiFi__Mic1__source"
      }
    ]
    actions = {
      update-props = {
        node.nick = "Scarlett Mic (XLR)"
        node.description = "Scarlett Solo — Input 1, XLR mic"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*Focusrite.*HiFi__Mic2__source"
      }
    ]
    actions = {
      update-props = {
        node.nick = "Scarlett Line/Inst"
        node.description = "Scarlett Solo — Input 2, instrument/line"
      }
    }
  }
  {
    ## NVIDIA HDMI audio. Matched by the pci path rather than the card name so
    ## it keeps working if the GPU is renamed by a driver update.
    matches = [
      {
        node.name = "~alsa_output.pci-.*hdmi.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
