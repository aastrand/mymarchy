# Preserve VRAM across suspend.
#
# Without this the driver keeps only "essential" allocations over a sleep
# transition and discards the rest, so on resume clients find their GPU buffers
# gone. Symptoms seen here:
#
#   at suspend entry, every time:
#     NVRM: Check failed: Out of memory [NV_ERR_NO_MEMORY] returned from
#           _memdescAllocInternal(pMemDesc) @ mem_desc.c:1338
#   at resume, every time:
#     [drm:__nv_drm_semsurf_wait_fence_work_cb [nvidia_drm]] *ERROR*
#     Failed to register auto-value-update on pre-wait value for sync FD
#     semaphore surface
#
# and kitty frozen for ~5s after every resume while other windows were fine --
# kitty drives OpenGL with explicit-sync fences, which is exactly the failing
# path, whereas the XWayland apps take a different one.
#
# Not a local invention: the Ubuntu install on this same hardware shipped this
# (Ubuntu's driver packages configure it automatically, Arch leaves it to the
# user), and suspend worked there.
#
# This file is deliberately NOT nvidia.conf -- Omarchy's installer overwrites
# that one, which would silently drop these options on a reinstall.
#
# The three nvidia sleep services must be enabled alongside this; the option
# alone does nothing without them:
#   systemctl enable nvidia-suspend nvidia-resume nvidia-hibernate
#
# And the initramfs must be rebuilt (mkinitcpio -P): the NVIDIA modules are
# early-loaded from it, and the modconf hook is what carries modprobe.d inside.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
