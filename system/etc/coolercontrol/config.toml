f226946857a3141b80fefa0bae8de91cdba1c6eedf91d96ea7bef76ce88b4e90 = "ASUS Aura LED Controller"
961547fb3857172fc22c5f76f1acf7f103bf2512c68dec92287a81c9814fd2c6 = "spd5118"
