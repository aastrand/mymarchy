# Re-enable user-session freezing during suspend.
#
# nvidia-utils ships 10-nvidia-no-freeze-session.conf setting this to false, so
# Wayland clients keep running while the GPU is being suspended. They issue GPU
# work into a driver that is going down, the fences never signal, and on resume
# the kernel logs:
#   [drm:__nv_drm_semsurf_wait_fence_work_cb [nvidia_drm]] *ERROR*
#   Failed to register auto-value-update on pre-wait value for sync FD semaphore
# kitty then blocks for ~5s waiting on a fence that will never come. XWayland
# apps are unaffected.
#
# NVIDIA disables freezing because their VRAM-preservation path wants the
# session responsive, so this may conflict with
# NVreg_PreserveVideoMemoryAllocations=1. If NV_ERR_NO_MEMORY reappears at
# suspend, that is the conflict showing up, and this file is the thing to
# remove.
#
# Numbered 20- so it sorts after nvidia's 10- drop-in and wins.
[Service]
Environment="SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=true"
