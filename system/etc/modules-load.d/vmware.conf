# VMware Workstation needs /dev/vmci for guest<->host communication. vmmon and
# vmnet come from the DKMS package and are loaded by vmware-networks; these two
# are in-tree kernel modules that nothing loads automatically, so VMware fails
# with: Failed to open device "/dev/vmci": No such file or directory
vmw_vmci
vmw_vsock_vmci_transport

# vmmon is the DKMS hypervisor module and vmnet its networking counterpart.
# vmware-networks.service loads vmnet but not vmmon: that one is meant to be
# loaded on demand when a VM starts, which does not happen reliably here.
# After a reboot VMware failed with:
#   Could not open /dev/vmmon: No such file or directory
# despite DKMS reporting it built and installed for the running kernel. The
# boot log showed systemd-modules-load inserting only the two vmci modules,
# because those were the only ones listed here.
vmmon
vmnet
